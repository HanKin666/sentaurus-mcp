[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentaurus-batch-mcp"
version = "0.1.0"
description = "Standalone MCP server for native Sentaurus batch experiments"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = ["mcp>=1.12,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
sentaurus-mcp = "sentaurus_mcp.server:main"
sentaurus-worker = "sentaurus_mcp.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
