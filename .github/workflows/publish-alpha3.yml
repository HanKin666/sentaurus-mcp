name: Publish reviewed alpha.3
on:
  push:
    branches: [main]
    paths:
      - '.release/alpha3-assets.json'
      - '.github/workflows/publish-alpha3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'HanKin666/sentaurus-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed product and decode reviewed assets
        run: python .github/scripts/publish_alpha3.py --prepare
      - name: Install the reviewed wheel
        run: python -m pip install '_release_assets/sentaurus_batch_mcp-0.1.0a3-py3-none-any.whl[test]'
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run software regression tests
        run: python -m pytest -q
      - name: Publish prerelease and reviewed downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_alpha3.py --publish
